[project]
name = "defillama-mcp"
version = "0.1.0"
description = "MCP server wrapping the DefiLlama public API for the web3-vc plugin."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
defillama-mcp = "defillama_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defillama_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits the live DefiLlama API; requires internet",
]
